version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wms_postgres
    environment:
      POSTGRES_USER: wms_user
      POSTGRES_PASSWORD: wms_pass
      POSTGRES_DB: wms_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: